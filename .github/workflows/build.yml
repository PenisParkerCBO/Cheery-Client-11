name: Build FireVisual

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Extract source
        run: unzip FireVisual-Client-MC-1.21.11-source.zip

      - name: Build JAR
        run: gradle build
        working-directory: FireVisual-Client

      - uses: actions/upload-artifact@v4
        with:
          name: FireVisual-JAR
          path: FireVisual-Client/build/libs/*.jar
          
